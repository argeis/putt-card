<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Putt Card</title>
<meta name="description" content="Minigolf scorecard for any number of players. One tap per score.">
<meta name="theme-color" content="#EEF3EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C130F" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Putt Card">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-hole-at-a-time thumb zone — giant hole number up top, tap-chip rows per player, fixed nav bar at the bottom */
:root {
  --bg: #EEF3EE;
  --surface: #FFFFFF;
  --surface-2: #E2EAE3;
  --ink: #13201A;
  --muted: #5A6A60;
  --line: #D2DDD5;
  --turf: #1C7A43;
  --turf-ink: #FFFFFF;
  --turf-soft: #B5D9C2;
  --flag: #F4C430;
  --flag-ink: #2A2100;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C130F; --surface: #151F19; --surface-2: #213028; --ink: #E6EEE8; --muted: #91A398;
    --line: #26342C; --turf: #45C47C; --turf-ink: #04130A; --turf-soft: #2B5A3E;
    --flag: #F6CD47; --flag-ink: #2A2100; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C130F; --surface: #151F19; --surface-2: #213028; --ink: #E6EEE8; --muted: #91A398;
  --line: #26342C; --turf: #45C47C; --turf-ink: #04130A; --turf-soft: #2B5A3E;
  --flag: #F6CD47; --flag-ink: #2A2100; color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; overflow-x: hidden; }
body { margin: 0; overscroll-behavior-y: none; }
[hidden] { display: none !important; }
img { max-width: 100%; }
.chip, .nav, .stepper button, .seg button, .brand { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 16px; line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--turf); outline-offset: 2px; }
button:disabled { opacity: .35; cursor: default; }

#app {
  max-width: 560px; margin: 0 auto; min-height: 100%;
  padding-inline: 16px; padding-block: 0 112px;
  overflow-x: clip; /* hole slide-in must never widen the page */
}

/* top bar */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 12px; background: var(--bg);
}
.brand {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--display); font-weight: 800; font-size: 22px;
  letter-spacing: .06em; text-transform: uppercase;
}
.ball {
  width: 14px; height: 14px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, var(--surface) 0 40%, var(--surface-2) 100%);
  box-shadow: inset 0 0 0 1.5px var(--ink);
}
.ghost {
  border: 1.5px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 14px; min-height: 40px;
}

.lbl {
  font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
}

/* ---------- setup ---------- */
.setup-h {
  font-family: var(--display); font-weight: 800; font-size: 44px; line-height: .95;
  text-transform: uppercase; margin: 16px 0 16px; text-wrap: balance;
}
.add { display: flex; gap: 8px; }
.add input {
  flex: 1; min-width: 0; height: 52px; padding: 0 16px; font: inherit; font-size: 17px;
  background: var(--surface); color: var(--ink);
  border: 1.5px solid var(--line); border-radius: var(--r);
}
.add input::placeholder { color: var(--muted); }
.add button {
  height: 52px; padding: 0 20px; border: 0; border-radius: var(--r);
  background: var(--ink); color: var(--bg); font-weight: 700;
}
.roster { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.roster li {
  display: flex; align-items: center; gap: 12px;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r);
  padding: 6px 6px 6px 14px; min-height: 52px;
}
.roster .n { font-family: var(--display); font-weight: 700; font-size: 15px; color: var(--muted); width: 18px; }
.roster .nm { flex: 1; min-width: 0; font-weight: 600; font-size: 17px; overflow-wrap: anywhere; }
.roster .x {
  width: 40px; height: 40px; border: 0; border-radius: 10px; background: var(--surface-2);
  font-size: 20px; line-height: 1; color: var(--muted);
}
.empty { color: var(--muted); font-size: 15px; margin: 14px 2px 0; }
.linkish { background: none; border: 0; padding: 0; color: var(--turf); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

.opts { display: grid; gap: 20px; margin-top: 28px; }
.opt { display: grid; gap: 8px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; background: var(--surface-2); padding: 4px; border-radius: var(--r); }
.seg button {
  height: 46px; border: 0; border-radius: 10px; background: transparent;
  font-family: var(--display); font-weight: 700; font-size: 22px; color: var(--muted);
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.opt small { color: var(--muted); font-size: 13px; }

/* ---------- play ---------- */
.hero {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;
  margin: 4px 0 6px;
}
.holeno { display: grid; }
.holeno .num {
  font-family: var(--display); font-weight: 800; font-size: 104px; line-height: .82;
  font-variant-numeric: tabular-nums; letter-spacing: -.01em;
}
.holeno .of { font-family: var(--display); font-weight: 600; font-size: 22px; color: var(--muted); margin-left: 6px; }
.holeno .row { display: flex; align-items: baseline; }
.parbox { display: grid; gap: 6px; justify-items: end; padding-bottom: 4px; }
.stepper { display: flex; align-items: center; background: var(--surface); border: 1.5px solid var(--line); border-radius: 999px; }
.stepper button { width: 44px; height: 44px; border: 0; background: none; font-size: 22px; color: var(--muted); }
.stepper .pv { font-family: var(--display); font-weight: 800; font-size: 28px; min-width: 22px; text-align: center; font-variant-numeric: tabular-nums; }
.hint { color: var(--muted); font-size: 13px; margin: 6px 0 14px; }

.rows { display: grid; gap: 10px; }
.prow {
  background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r);
  padding: 12px; display: grid; gap: 10px;
  transition: border-color .2s;
}
.prow.done { border-color: var(--turf-soft); }
.phead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.pname { font-weight: 700; font-size: 18px; min-width: 0; overflow-wrap: anywhere; display: flex; align-items: center; gap: 8px; }
.acetag {
  font-family: var(--display); font-weight: 800; font-size: 13px; letter-spacing: .1em; text-transform: uppercase;
  background: var(--flag); color: var(--flag-ink); padding: 2px 8px; border-radius: 999px;
}
.ptot { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ptot b { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1; }
.topar { font-size: 13px; font-weight: 600; color: var(--muted); min-width: 22px; text-align: right; }
.topar.under { color: var(--turf); }

.chips { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.chip {
  height: 50px; border: 0; border-radius: 11px; background: var(--surface-2);
  font-family: var(--display); font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums;
  transition: transform .08s, background .15s;
}
.chip:active { transform: scale(.94); }
.chip.on { background: var(--turf); color: var(--turf-ink); }
.chip.on.ace { background: var(--flag); color: var(--flag-ink); }
.chip.more { font-size: 20px; color: var(--muted); }
.chip.more.on { font-size: 26px; color: var(--turf-ink); }
.pop { animation: pop .35s ease-out; }
@keyframes pop { 0% { transform: scale(.85); } 60% { transform: scale(1.1); } 100% { transform: scale(1); } }
.slide-l { animation: inL .22s ease-out; }
.slide-r { animation: inR .22s ease-out; }
@keyframes inL { from { opacity: .3; transform: translateX(24px); } to { opacity: 1; transform: none; } }
@keyframes inR { from { opacity: .3; transform: translateX(-24px); } to { opacity: 1; transform: none; } }

/* bottom bar */
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--bg); border-top: 1.5px solid var(--line);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
}
.bar-in { max-width: 528px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.nav {
  height: 54px; border-radius: var(--r); border: 1.5px solid var(--line); background: var(--surface);
  font-weight: 700; font-size: 16px; padding: 0 16px; white-space: nowrap;
}
.nav.prev { width: 64px; padding: 0; font-size: 22px; }
.nav.next { flex: 0 0 auto; min-width: 116px; }
.nav.primary, .nav.next.ready { background: var(--turf); color: var(--turf-ink); border-color: var(--turf); }
.nav.wide { flex: 1; }
.track { flex: 1; min-width: 0; display: flex; gap: 3px; align-items: center; }
.track i { flex: 1; height: 8px; border-radius: 3px; background: var(--surface-2); }
.track i.f { background: var(--turf-soft); }
.track i.c { background: var(--ink); height: 14px; }

/* ---------- scorecard ---------- */
.sec { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 10px 0 10px; }
.sec h2 { font-family: var(--display); font-weight: 800; font-size: 30px; text-transform: uppercase; margin: 0; }
.sec span { color: var(--muted); font-size: 13px; }
.stand { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.stand li {
  display: grid; grid-template-columns: 30px 1fr auto 44px; align-items: center; gap: 10px;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r); padding: 10px 14px;
}
.stand li.lead { border-color: var(--turf); }
.stand .rk { font-family: var(--display); font-weight: 800; font-size: 24px; color: var(--muted); }
.stand li.lead .rk { color: var(--turf); }
.stand .nm { font-weight: 700; font-size: 17px; min-width: 0; overflow-wrap: anywhere; display: grid; }
.stand .nm small { font-weight: 500; font-size: 13px; color: var(--muted); }
.stand .tt { font-family: var(--display); font-weight: 800; font-size: 30px; font-variant-numeric: tabular-nums; }
.stand .tp { text-align: right; font-weight: 600; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stand .tp.under { color: var(--turf); }

.tablewrap {
  overflow-x: auto; margin-top: 24px; border: 1.5px solid var(--line); border-radius: var(--r);
  background: var(--surface); -webkit-overflow-scrolling: touch;
}
table { border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; font-size: 15px; }
th, td { padding: 0; text-align: center; border-bottom: 1px solid var(--line); height: 44px; min-width: 38px; }
tbody tr:last-child th, tbody tr:last-child td { border-bottom: 0; }
thead th { font-family: var(--display); font-weight: 700; font-size: 16px; }
thead button { width: 100%; height: 44px; border: 0; background: none; font-family: var(--display); font-weight: 700; font-size: 16px; color: var(--turf); text-decoration: underline; text-underline-offset: 3px; }
.parrow th, .parrow td { color: var(--muted); font-size: 13px; height: 32px; }
th.sticky {
  position: sticky; left: 0; z-index: 1; background: var(--surface); text-align: left;
  padding: 0 12px; min-width: 96px; max-width: 120px; border-right: 1px solid var(--line);
  font-family: var(--body); font-weight: 700; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
td.tot { font-family: var(--display); font-weight: 800; font-size: 18px; border-left: 1px solid var(--line); padding: 0 10px; }
td.ace { background: var(--flag); color: var(--flag-ink); font-weight: 700; }
td.under { color: var(--turf); font-weight: 700; }
td.blank { color: var(--muted); }
.tnote { color: var(--muted); font-size: 13px; margin: 8px 2px 0; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
@media (max-width: 360px) {
  .chip { height: 46px; font-size: 22px; }
  .holeno .num { font-size: 88px; }
}

.install {
  margin-top: 28px; background: var(--surface); border: 1.5px dashed var(--line);
  border-radius: var(--r); padding: 14px; display: grid; gap: 10px;
}
.install p { margin: 0; font-size: 15px; color: var(--muted); }
.install b { color: var(--ink); }
.ghost.solid { justify-self: start; background: var(--turf); color: var(--turf-ink); border-color: var(--turf); }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  var KEY = 'puttcard.v1';
  var app = document.getElementById('app');
  var S = load() || fresh();
  var armed = false, armTimer = null, lastPop = null;

  function fresh() { return { players: [], holes: 18, defPar: 2, par: [], scores: {}, hole: 0, view: 'setup', started: false }; }
  function load() { try { var s = JSON.parse(localStorage.getItem(KEY)); return s && s.players ? s : null; } catch (e) { return null; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  function uid() { return Math.random().toString(36).slice(2, 9); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function buzz() { try { navigator.vibrate && navigator.vibrate(8); } catch (e) {} }
  function fmtPar(n) { return n === 0 ? 'E' : (n > 0 ? '+' + n : '−' + Math.abs(n)); }

  function stats(p) {
    var sc = S.scores[p.id] || [], tot = 0, par = 0, thru = 0, aces = 0;
    for (var i = 0; i < sc.length; i++) {
      var v = sc[i];
      if (v != null) { tot += v; par += S.par[i]; thru++; if (v === 1) aces++; }
    }
    return { tot: tot, toPar: tot - par, thru: thru, aces: aces };
  }
  function holeDone(i) { return S.players.length > 0 && S.players.every(function (p) { return S.scores[p.id][i] != null; }); }

  /* ---------- wake lock (keeps screen on mid-round) ---------- */
  function lock() {
    try {
      if ('wakeLock' in navigator && document.visibilityState === 'visible' && S.view !== 'setup') {
        navigator.wakeLock.request('screen').catch(function () {});
      }
    } catch (e) {}
  }
  document.addEventListener('visibilitychange', lock);

  /* ---------- install prompt ---------- */
  var deferredPrompt = null;
  function isStandalone() {
    try { return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; } catch (e) { return false; }
  }
  function isIOS() {
    var ua = navigator.userAgent;
    return /iphone|ipad|ipod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  }
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferredPrompt = e; renderInstall(); });
  window.addEventListener('appinstalled', function () { deferredPrompt = null; renderInstall(); });
  function renderInstall() {
    var slot = document.getElementById('installSlot');
    if (!slot) return;
    if (isStandalone()) { slot.innerHTML = ''; return; }
    var body;
    if (deferredPrompt) {
      body = '<p>Put Putt Card on your home screen. It opens full-screen and works without signal.</p>' +
        '<button type="button" class="ghost solid" data-act="install">Install app</button>';
    } else if (isIOS()) {
      body = '<p>Tap the <b>Share</b> button in Safari, then <b>Add to Home Screen</b>. It opens full-screen and works without signal.</p>';
    } else {
      body = '<p>Open your browser menu and choose <b>Install app</b> or <b>Add to Home screen</b>. It opens full-screen and works without signal.</p>';
    }
    slot.innerHTML = '<aside class="install"><span class="lbl">Install on your phone</span>' + body + '</aside>';
  }

  /* ---------- render ---------- */
  function render(anim) {
    if (S.view === 'play') renderPlay(anim);
    else if (S.view === 'card') renderCard();
    else renderSetup();
    save();
  }

  function brand() { return '<span class="brand"><span class="ball" aria-hidden="true"></span>Putt Card</span>'; }

  function renderSetup() {
    app.innerHTML =
      '<header class="top">' + brand() + '</header>' +
      '<h1 class="setup-h">Who’s playing?</h1>' +
      '<form id="addForm" class="add" autocomplete="off">' +
        '<input id="newPlayer" type="text" placeholder="Player name" maxlength="24" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="enter" aria-label="Player name">' +
        '<button type="submit">Add</button>' +
      '</form>' +
      '<ul id="roster" class="roster"></ul>' +
      '<div class="opts">' +
        '<div class="opt"><span class="lbl">Holes</span><div class="seg" data-key="holes">' +
          [9, 12, 18].map(function (n) { return '<button type="button" data-act="seg" data-v="' + n + '" aria-pressed="' + (S.holes === n) + '">' + n + '</button>'; }).join('') +
        '</div></div>' +
        '<div class="opt"><span class="lbl">Par per hole</span><div class="seg" data-key="defPar">' +
          [2, 3, 4].map(function (n) { return '<button type="button" data-act="seg" data-v="' + n + '" aria-pressed="' + (S.defPar === n) + '">' + n + '</button>'; }).join('') +
        '</div><small>You can change par on any hole while you play.</small></div>' +
      '</div>' +
      '<div id="installSlot"></div>' +
      '<nav class="bar"><div class="bar-in"><button id="startBtn" class="nav primary wide" data-act="start"></button></div></nav>';
    renderRoster();
    renderInstall();
    document.getElementById('addForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var inp = document.getElementById('newPlayer');
      var name = inp.value.trim();
      if (name) { S.players.push({ id: uid(), name: name }); inp.value = ''; renderRoster(); save(); buzz(); }
      inp.focus();
    });
  }

  function renderRoster() {
    var ul = document.getElementById('roster');
    ul.innerHTML = S.players.map(function (p, i) {
      return '<li><span class="n">' + (i + 1) + '</span><span class="nm">' + esc(p.name) + '</span>' +
        '<button type="button" class="x" data-act="rm" data-p="' + p.id + '" aria-label="Remove ' + esc(p.name) + '">×</button></li>';
    }).join('');
    var old = document.getElementById('emptyNote');
    if (old) old.remove();
    if (!S.players.length) {
      ul.insertAdjacentHTML('afterend', '<p id="emptyNote" class="empty">Add as many players as you like. Or <button type="button" class="linkish" data-act="sample">load three example players</button> to try it out.</p>');
    }
    var b = document.getElementById('startBtn');
    var n = S.players.length;
    b.disabled = !n;
    b.textContent = n ? 'Tee off · ' + n + ' player' + (n > 1 ? 's' : '') : 'Add a player to start';
  }

  function renderPlay(anim) {
    var h = S.hole, n = S.holes, scored = 0;
    var rows = S.players.map(function (p) {
      var v = S.scores[p.id][h], st = stats(p);
      if (v != null) scored++;
      var chips = '';
      for (var k = 1; k <= 6; k++) {
        var on = v === k;
        chips += '<button class="chip' + (on ? ' on' : '') + (k === 1 ? ' ace' : '') + '" data-act="score" data-p="' + p.id + '" data-v="' + k + '" aria-pressed="' + on + '" aria-label="' + esc(p.name) + ' ' + k + ' stroke' + (k > 1 ? 's' : '') + '">' + k + '</button>';
      }
      var big = v != null && v > 6;
      chips += '<button class="chip more' + (big ? ' on' : '') + '" data-act="more" data-p="' + p.id + '" aria-label="' + esc(p.name) + (big ? ' ' + v + ' strokes, tap to add one' : ' 7 or more strokes') + '">' + (big ? v : '7+') + '</button>';
      var tp = st.thru ? '<span class="topar' + (st.toPar < 0 ? ' under' : '') + '">' + fmtPar(st.toPar) + '</span>' : '<span class="topar"></span>';
      return '<section class="prow' + (v != null ? ' done' : '') + '">' +
        '<div class="phead"><span class="pname">' + esc(p.name) + (v === 1 ? '<span class="acetag">Ace</span>' : '') + '</span>' +
        '<span class="ptot"><b>' + st.tot + '</b>' + tp + '</span></div>' +
        '<div class="chips">' + chips + '</div></section>';
    }).join('');

    var segs = '';
    for (var i = 0; i < n; i++) segs += '<i class="' + (i === h ? 'c' : (holeDone(i) ? 'f' : '')) + '"></i>';
    var complete = scored === S.players.length;

    app.innerHTML =
      '<header class="top">' + brand() + '<button class="ghost" data-act="view" data-v="card">Scorecard</button></header>' +
      '<div id="holeView" class="' + (anim || '') + '">' +
        '<div class="hero">' +
          '<div class="holeno"><span class="lbl">Hole</span><div class="row"><span class="num">' + (h + 1) + '</span><span class="of">/ ' + n + '</span></div></div>' +
          '<div class="parbox"><span class="lbl">Par</span><div class="stepper">' +
            '<button data-act="par" data-d="-1" aria-label="Lower par"' + (S.par[h] <= 1 ? ' disabled' : '') + '>−</button>' +
            '<span class="pv" aria-live="polite">' + S.par[h] + '</span>' +
            '<button data-act="par" data-d="1" aria-label="Raise par"' + (S.par[h] >= 9 ? ' disabled' : '') + '>+</button>' +
          '</div></div>' +
        '</div>' +
        '<p class="hint">' + (complete ? 'All scored. Tap ' + (h === n - 1 ? 'Finish' : 'Next') + ' or swipe left.' : scored + ' of ' + S.players.length + ' scored · tap a number again to clear it') + '</p>' +
        '<div class="rows">' + rows + '</div>' +
      '</div>' +
      '<nav class="bar"><div class="bar-in">' +
        '<button class="nav prev" data-act="go" data-d="-1" aria-label="Previous hole"' + (h === 0 ? ' disabled' : '') + '>‹</button>' +
        '<div class="track" aria-hidden="true">' + segs + '</div>' +
        '<button class="nav next' + (complete ? ' ready' : '') + '" data-act="go" data-d="1">' + (h === n - 1 ? 'Finish' : 'Next ›') + '</button>' +
      '</div></nav>';

    if (lastPop) {
      var el = app.querySelector('[data-p="' + lastPop.p + '"][data-act="' + lastPop.act + '"]' + (lastPop.act === 'score' ? '[data-v="' + lastPop.v + '"]' : ''));
      if (el) el.classList.add('pop');
      lastPop = null;
    }
  }

  function standings() {
    var list = S.players.map(function (p) { var s = stats(p); s.p = p; return s; });
    list.sort(function (a, b) {
      if (!a.thru !== !b.thru) return a.thru ? -1 : 1;
      return a.toPar - b.toPar || a.tot - b.tot || b.thru - a.thru;
    });
    var rank = 0, prev = null;
    list.forEach(function (s, i) {
      var key = s.thru ? s.toPar + ':' + s.tot : 'none';
      if (key !== prev) rank = i + 1;
      s.rank = rank; prev = key;
    });
    return list;
  }

  function renderCard() {
    var n = S.holes, list = standings();
    var maxThru = list.reduce(function (m, s) { return Math.max(m, s.thru); }, 0);
    var anyScore = maxThru > 0;

    var stand = list.map(function (s) {
      var sub = s.thru ? 'thru ' + s.thru + (s.aces ? ' · ' + s.aces + ' ace' + (s.aces > 1 ? 's' : '') : '') : 'no scores yet';
      return '<li class="' + (anyScore && s.rank === 1 && s.thru ? 'lead' : '') + '">' +
        '<span class="rk">' + (s.thru ? s.rank : '–') + '</span>' +
        '<span class="nm">' + esc(s.p.name) + '<small>' + sub + '</small></span>' +
        '<span class="tt">' + s.tot + '</span>' +
        '<span class="tp' + (s.thru && s.toPar < 0 ? ' under' : '') + '">' + (s.thru ? fmtPar(s.toPar) : '') + '</span></li>';
    }).join('');

    var head = '<tr><th class="sticky">Hole</th>', parRow = '<tr class="parrow"><th class="sticky">Par</th>', parSum = 0;
    for (var i = 0; i < n; i++) {
      head += '<th><button data-act="jump" data-h="' + i + '" aria-label="Go to hole ' + (i + 1) + '">' + (i + 1) + '</button></th>';
      parRow += '<td>' + S.par[i] + '</td>'; parSum += S.par[i];
    }
    head += '<th>Tot</th></tr>'; parRow += '<td class="tot">' + parSum + '</td></tr>';
    var body = S.players.map(function (p) {
      var r = '<tr><th class="sticky" scope="row">' + esc(p.name) + '</th>';
      for (var i = 0; i < n; i++) {
        var v = S.scores[p.id][i];
        var cls = v == null ? 'blank' : (v === 1 ? 'ace' : (v < S.par[i] ? 'under' : ''));
        r += '<td class="' + cls + '">' + (v == null ? '·' : v) + '</td>';
      }
      return r + '<td class="tot">' + stats(p).tot + '</td></tr>';
    }).join('');

    app.innerHTML =
      '<header class="top">' + brand() + '<button class="ghost" data-act="view" data-v="play">Hole ' + (S.hole + 1) + '</button></header>' +
      '<div class="sec"><h2>Standings</h2><span>' + (anyScore ? 'after ' + maxThru + ' of ' + n + ' holes' : 'round not started') + '</span></div>' +
      '<ol class="stand">' + stand + '</ol>' +
      '<div class="tablewrap"><table><thead>' + head + parRow + '</thead><tbody>' + body + '</tbody></table></div>' +
      '<p class="tnote">Tap a hole number to jump back and fix a score. Yellow is a hole in one.</p>' +
      '<nav class="bar"><div class="bar-in">' +
        '<button class="nav wide" data-act="new">' + (armed ? 'Tap again to clear scores' : 'New game') + '</button>' +
        '<button class="nav primary wide" data-act="view" data-v="play">Back to hole ' + (S.hole + 1) + '</button>' +
      '</div></nav>';
  }

  /* ---------- actions ---------- */
  function go(d) {
    var nh = S.hole + d;
    if (nh >= S.holes) { S.view = 'card'; render(); window.scrollTo(0, 0); return; }
    if (nh < 0) return;
    S.hole = nh; buzz();
    render(d > 0 ? 'slide-l' : 'slide-r');
    window.scrollTo(0, 0);
  }

  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    var act = b.dataset.act, pid = b.dataset.p;

    if (act === 'seg') {
      var key = b.parentNode.dataset.key, v = +b.dataset.v;
      S[key] = v;
      b.parentNode.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b); });
      save();
    } else if (act === 'rm') {
      S.players = S.players.filter(function (p) { return p.id !== pid; });
      renderRoster(); save();
    } else if (act === 'sample') {
      ['Sam (example)', 'Priya (example)', 'Jordan (example)'].forEach(function (nm) { S.players.push({ id: uid(), name: nm }); });
      renderRoster(); save();
    } else if (act === 'start') {
      S.par = []; for (var i = 0; i < S.holes; i++) S.par.push(S.defPar);
      S.scores = {};
      S.players.forEach(function (p) { S.scores[p.id] = new Array(S.holes).fill(null); });
      S.hole = 0; S.view = 'play'; S.started = true;
      render(); window.scrollTo(0, 0); lock();
    } else if (act === 'score') {
      var v = +b.dataset.v, cur = S.scores[pid][S.hole];
      S.scores[pid][S.hole] = cur === v ? null : v;
      if (cur !== v) lastPop = { p: pid, act: 'score', v: v };
      buzz(); render();
    } else if (act === 'more') {
      var c = S.scores[pid][S.hole];
      S.scores[pid][S.hole] = (c != null && c >= 7) ? Math.min(c + 1, 20) : 7;
      lastPop = { p: pid, act: 'more' };
      buzz(); render();
    } else if (act === 'par') {
      S.par[S.hole] = Math.max(1, Math.min(9, S.par[S.hole] + +b.dataset.d));
      render();
    } else if (act === 'go') {
      go(+b.dataset.d);
    } else if (act === 'view') {
      S.view = b.dataset.v; armed = false; render(); window.scrollTo(0, 0);
    } else if (act === 'jump') {
      S.hole = +b.dataset.h; S.view = 'play'; render(); window.scrollTo(0, 0);
    } else if (act === 'install') {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function () { deferredPrompt = null; renderInstall(); }, function () {});
      }
    } else if (act === 'new') {
      if (!armed) {
        armed = true; render();
        clearTimeout(armTimer);
        armTimer = setTimeout(function () { armed = false; if (S.view === 'card') render(); }, 3500);
      } else {
        armed = false; clearTimeout(armTimer);
        S.scores = {}; S.par = []; S.hole = 0; S.started = false; S.view = 'setup';
        render(); window.scrollTo(0, 0);
      }
    }
  });

  /* swipe between holes */
  var tx = null, ty = null;
  app.addEventListener('touchstart', function (e) {
    if (S.view !== 'play' || e.target.closest('.bar')) { tx = null; return; }
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, { passive: true });
  app.addEventListener('touchend', function (e) {
    if (tx == null) return;
    var t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty;
    tx = null;
    if (Math.abs(dx) > 70 && Math.abs(dy) < 50) go(dx < 0 ? 1 : -1);
  }, { passive: true });

  document.addEventListener('keydown', function (e) {
    if (S.view !== 'play' || e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight') go(1);
    if (e.key === 'ArrowLeft') go(-1);
  });

  // Guard against a saved round whose players no longer line up
  if (S.view !== 'setup' && (!S.players.length || S.players.some(function (p) { return !S.scores[p.id]; }))) S.view = 'setup';
  render();
  lock();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>
